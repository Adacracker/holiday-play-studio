    _v.set(o.group.position.x + px + tx * lerp(-L, L, u), o.traceY, pz + tz * lerp(-L, L, u)); const s = toScreen(_v);
    hand.style.transform = `translate(${s.x}px,${s.y}px)`; hand.style.opacity = ph < 0.08 || ph > 0.85 ? 0 : 1;
    if (ph > 0.12 && ph < 0.72) gtrail.push({ x: s.x, y: s.y, t: gameT, ghost: true, brk: ph < 0.14 });
  } else if (tutKind === 'hammer') { _v.copy(o.target); o.group.localToWorld(_v); const s = toScreen(_v); hand.style.transform = `translate(${s.x}px,${s.y}px)`; }
  else { _v.set(o.group.position.x + 0.5, o.traceY, 0.3); const s = toScreen(_v); hand.style.transform = `translate(${s.x}px,${s.y}px)`; hand.hidden = !!press0; }
}

// ---------- overlay canvas: swipe trail, ghost line, press meter
function drawFx() {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  if (fx.width !== Math.round(w * dpr) || fx.height !== Math.round(h * dpr)) { fx.width = Math.round(w * dpr); fx.height = Math.round(h * dpr); }
  fxg.setTransform(dpr, 0, 0, dpr, 0, 0); fxg.clearRect(0, 0, w, h);
  while (trail.length && gameT - trail[0].t > 0.25) trail.shift();
  while (gtrail.length && gameT - gtrail[0].t > 0.25) gtrail.shift();
  fxg.lineCap = 'round'; fxg.lineJoin = 'round';
  for (const tr of [gtrail, trail]) for (let i = 1; i < tr.length; i++) {
    const a = tr[i - 1], b = tr[i]; if (b.brk) continue;
    const k = 1 - (gameT - b.t) / 0.25; if (k <= 0) continue;
    const ghostA = b.ghost ? 0.55 : 1;
    fxg.strokeStyle = `rgba(255,255,255,${0.25 * k * ghostA})`; fxg.lineWidth = 16 * k; fxg.beginPath(); fxg.moveTo(a.x, a.y); fxg.lineTo(b.x, b.y); fxg.stroke();
    fxg.strokeStyle = `rgba(255,255,255,${0.95 * k * ghostA})`; fxg.lineWidth = 5 * k; fxg.beginPath(); fxg.moveTo(a.x, a.y); fxg.lineTo(b.x, b.y); fxg.stroke();
  }
  for (let i = glints.length - 1; i >= 0; i--) { // slash glints
    const g = glints[i], k = 1 - (gameT - g.t) / 0.32; if (k <= 0) { glints.splice(i, 1); continue; }
    const u = Math.min(1, (gameT - g.t) / 0.08), mx = lerp(g.a.x, g.b.x, u), my = lerp(g.a.y, g.b.y, u);
    const gr = fxg.createLinearGradient(g.a.x, g.a.y, g.b.x, g.b.y); const c = g.q === 3 ? '255,236,150' : '255,255,255';
    gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(0.5, `rgba(${c},${k})`); gr.addColorStop(1, `rgba(${c},0)`);
    fxg.strokeStyle = gr; fxg.lineWidth = 3 + 7 * k; fxg.beginPath(); fxg.moveTo(g.a.x, g.a.y); fxg.lineTo(mx, my); fxg.stroke();
    fxg.lineWidth = 1.5 + 2 * k; fxg.strokeStyle = `rgba(255,255,255,${k})`; fxg.beginPath(); fxg.moveTo(lerp(g.a.x, mx, 0.15), lerp(g.a.y, my, 0.15)); fxg.lineTo(lerp(g.a.x, mx, 0.85), lerp(g.a.y, my, 0.85)); fxg.stroke();
  }
  if (kbMode && state === 'play') { // keyboard ghost line
    const t = kbTarget(), col = brand().primary;
    if (t && t.o.kind === 'swipe') {
      const [ax, az, bx, bz] = ghostLine(t.o, t.g), X = t.o.group.position.x;
      const s1 = toScreen(_v.set(ax * 0.5 + X, t.o.traceY, az * 0.5)), s2 = toScreen(_v.set(bx * 0.5 + X, t.o.traceY, bz * 0.5));
      fxg.setLineDash([10, 8]); fxg.strokeStyle = '#fff'; fxg.lineWidth = 8; fxg.beginPath(); fxg.moveTo(s1.x, s1.y); fxg.lineTo(s2.x, s2.y); fxg.stroke();
      fxg.strokeStyle = col; fxg.lineWidth = 4; fxg.stroke(); fxg.setLineDash([]);
    } else if (t && t.o.kind === 'hammer') {
      const sw = Math.sin(gameT * 2.4) * 0.45; _v.copy(t.o.target); _v.x += sw; t.o.group.localToWorld(_v); const s = toScreen(_v);
      fxg.strokeStyle = '#fff'; fxg.lineWidth = 7; fxg.beginPath(); fxg.arc(s.x, s.y, 14, 0, 7); fxg.stroke(); fxg.strokeStyle = col; fxg.lineWidth = 4; fxg.stroke();
    }
  }
  if (press0) { // press meter
    const o = press0.o; _v.set(o.group.position.x, o.traceY + 0.2, 0); const s = toScreen(_v), f = Math.min(1, press0.t), R = 46;
    const cx = s.x, cy = s.y - 70, a0 = -Math.PI / 2;
    fxg.lineWidth = 12; fxg.strokeStyle = 'rgba(255,255,255,.88)'; fxg.beginPath(); fxg.arc(cx, cy, R, 0, 7); fxg.stroke();
    fxg.strokeStyle = 'rgba(63,207,134,.95)'; fxg.beginPath(); fxg.arc(cx, cy, R, a0 + 0.68 * 6.283, a0 + 0.9 * 6.283); fxg.stroke();
    fxg.lineWidth = 7; fxg.strokeStyle = f > 0.9 ? '#ff5c6c' : '#ffc83d'; fxg.beginPath(); fxg.arc(cx, cy, R, a0, a0 + f * 6.283); fxg.stroke();
    fxg.fillStyle = '#fff'; fxg.font = '900 15px ui-rounded, system-ui, sans-serif'; fxg.textAlign = 'center'; fxg.fillText(f >= 0.68 && f <= 0.9 ? 'NOW!' : 'HOLD', cx, cy + 5);
  }
}

// ================= Round lifecycle =================
function resetRound() {
  objects.slice().forEach(removeObj); queue = []; belt = null; glints.length = 0; trail.length = 0; gtrail.length = 0;
  stroke = null; press0 = null; press.visible = false; press.userData = {}; hammerPiv.userData = {}; kbMode = false;
  score = 0; scoreShown = -1; combo = 0; rush = false; spawnN = 0; megaDone = false; lastMat = '';
  stats = { treats: 0, q: [0, 0, 0, 0], best: 0 };
  lvl = { flow: false }; HKit.music.tempo(138);
  showCombo(); hud(); setTut('');
}
function startPlay(first) {
  state = 'play'; roundT0 = gameT; $('hud').hidden = false;
  timer.start();
  if (first) HKit.hint('Swipe across the treat along the <b>dashed line</b>!' + (IS_TOUCH ? '' : '<small>Keyboard: SPACE shows a moving line, SPACE again cuts</small>'), 3000, 'swipe');
}
function timeUp() {
  if (state !== 'play') return;
  state = 'over'; stroke = null; kbMode = false; setTut('');
  if (press0) { press0 = null; press.visible = false; }
  HKit.music.tempo(138); HKit.sfx.sparkle();
  const b = brand(), conf = [b.primary, b.accent, '#ffffff', '#d4163c', '#2fa86a', '#ffd84a'];
  for (let i = 0; i < 4; i++) setTimeout(() => emitCrumbs((Math.random() - 0.5) * visHalfW * 1.6, 2.6, (Math.random() - 0.5) * 1.5, 45, conf, { spread: 2.2, up: 2.6, size: 0.05, g: 5, life: 2.6, w: 2.5, d: 1.5 }), i * 180);
  flash(0.25);
  setTimeout(showEnd, 1600);
}
function showEnd() {
  const chip = s => `<span>${s}</span>`;
  const extra = `<div class="hp-stats">${chip(`${stats.treats} treat${stats.treats === 1 ? '' : 's'} sliced`)}${chip(`${stats.q[3]} perfect cut${stats.q[3] === 1 ? '' : 's'}`)}${stats.best >= 2 ? chip(`best combo ×${stats.best}`) : ''}</div>`;
  HKit.end(score, extra).then(() => { resetRound(); spawnNext(nextSpec()); startPlay(false); });
}

// ================= Brand: live colour / logo updates =================
async function applyBrandArt() {
  drawRail(); paintDecor();
  for (const o of objects) { setColors(o.mat, o.V.colors.map(tok)); o.mat.uniforms.uLogoRing.value.set(tok('@s')); }
  try { logoImg = await Brand.logoImage(); } catch { logoImg = null; }
  drawSign(logoImg); paintGifts();
}
HKit.onBrand(() => { applyBrandArt(); });

// ================= Main loop =================
let visHalfW = 3;
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h; renderer.setSize(w, h, false);
  camera.aspect = asp; camera.fov = asp < 1 ? 48 : 38; camera.updateProjectionMatrix();
  const tv = Math.tan(camera.fov * Math.PI / 360), th = tv * asp;
  const dist = Math.max((asp < 1 ? 1.8 : 2.5) / th, 1.85 / tv);
  const el = asp < 1 ? 0.98 : 0.66, ty = asp < 1 ? 0.3 : 0.45;
  camBase.set(0, ty + Math.sin(el) * dist, Math.cos(el) * dist); camTgt.set(0, ty, 0);
  visHalfW = dist * th * 0.95; sparks.material.uniforms.uScale.value = h * 0.9;
  layoutDecor(asp);
}
const camBase = new THREE.Vector3(), camTgt = new THREE.Vector3();
addEventListener('resize', resize);

let last = 0;
function step(dt) {
  if (hitStop > 0) { hitStop -= dt; dt *= 0.12; }
  gameT += dt;
  const bdx = updateBelt(dt);
  roundLogic(dt);
  for (const o of objects) {
    updatePieces(o, dt);
    o.wob = Math.max(0, o.wob - dt * 1.4); o.mat.uniforms.uWob.value = o.wob * o.wob; o.mat.uniforms.uTime.value = gameT;
    syncGuides(o);
  }
  updateHammer(dt); updatePress(dt);
  updateCrumbs(dt, bdx); updateSparks(dt);
  tutCheck(); updateTutHand();
  shake = Math.max(0, shake - dt * 0.6); punch *= Math.exp(-dt * 7);
}
function render() {
  updateBulbs(gameT);
  scene.updateMatrixWorld();
  camera.position.copy(camBase); if (punch > 0.01) camera.position.lerp(camTgt, punch * 0.035); if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; }
  camera.lookAt(camTgt);
  let n = 0; // blob shadows
  for (const o of objects) for (const pc of o.pieces) {
    if (n >= SH_MAX) break; pc.mesh.localToWorld(_v.copy(pc.ctr)); const r = pc.rad * 1.5 * clamp(1.4 - _v.y * 0.4, 0.4, 1.2);
    _m.makeScale(r, 1, r * 0.85); _m.setPosition(_v.x, 0, _v.z); shadows.setMatrixAt(n++, _m);
  }
  shadows.count = n; shadows.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
  drawFx();
}
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  step(dt); render();
  requestAnimationFrame(frame);
}

// ================= Boot =================
(async () => {
  resize();
  try { logoTex = await Brand.logoTexture(THREE); } catch { logoTex = null; }
  await applyBrandArt();
  resetRound(); state = 'intro';
  spawnNext(nextSpec());
  for (let i = 0; i < 45; i++) step(1 / 30);
  render(); requestAnimationFrame(frame);
  HKit.ready();
  await splashP;
  startPlay(true);
})();

// test / screenshot hooks (read-only snapshot + time controls)
window.__game = {
  info: () => ({ state, score, combo, rush, left: +timer.left().toFixed(1), stats, objects: objects.map(o => ({ x: +o.group.position.x.toFixed(2), kind: o.kind, mat: o.spec.mat, v: o.spec.v, pat: o.spec.pattern, done: o.done, ready: o.ready })) }),
  endNow: () => timer.endNow(),
  guide: () => { const o = current(); if (!o) return null; const g = o.guides.find(g => !g.done); if (!g) return null; const px = g.nx * g.d, pz = g.nz * g.d, tx = -g.nz, tz = g.nx, L = Math.max(o.sh.b[0], o.sh.b[2]) * 1.9 + 0.3; const a = toScreen(new THREE.Vector3(o.group.position.x + px - tx * L, o.traceY, pz - tz * L)), b = toScreen(new THREE.Vector3(o.group.position.x + px + tx * L, o.traceY, pz + tz * L)); return { kind: o.kind, a, b, t: o.target ? toScreen(o.group.localToWorld(o.target.clone())) : null }; },
  spawn: spec => { objects.filter(o => !o.done).forEach(removeObj); belt = null; return !!spawnNext(spec); },
};
</script>
