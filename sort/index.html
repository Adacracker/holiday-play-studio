<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cocoa Sort</title>
<link rel="icon" href="data:,">
<script src="../shared/brand.js"></script><script>if(!window.Brand)document.write('<script src="_brandstub.js"><\/script>')</script><script src="hkit.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; overflow:hidden; background:#2a160d; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; font-weight:800; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  svg.i { width:1.25em; height:1.25em; vertical-align:-.25em; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  /* score pill (top right, next to the mute button; second row in portrait) */
  #score { position:fixed; z-index:60; pointer-events:none; right:calc(62px + env(safe-area-inset-right)); top:calc(38px + env(safe-area-inset-top));
    min-width:96px; padding:3px 14px 4px; border-radius:20px; background:rgba(255,255,255,.95); text-align:center; line-height:1.05;
    box-shadow:0 0 0 2.5px var(--brand-primary,#c62828), 0 4px 12px rgba(0,0,0,.22); color:var(--brand-secondary,#1b5e20); }
  #score b { display:block; font-size:21px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--brand-primary,#c62828); }
  #score small { display:block; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; opacity:.8; }
  #score.bump { animation:bump .28s ease-out; }
  @keyframes bump { 40% { transform:scale(1.16); } }
  body.portrait #score { right:calc(10px + env(safe-area-inset-right)); top:calc(86px + env(safe-area-inset-top)); }

  /* bottom action bar */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:3; display:flex; justify-content:center; gap:10px; padding:8px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); pointer-events:none; }
  .bb { pointer-events:auto; position:relative; border:0; cursor:pointer; font:inherit; font-size:15px; color:#fff; min-width:86px; height:46px; padding:0 12px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(color-mix(in srgb, var(--brand-primary,#c62828) 78%, #fff), var(--brand-primary,#c62828));
    border:2px solid rgba(255,255,255,.75); box-shadow:0 4px 0 color-mix(in srgb, var(--brand-primary,#c62828) 55%, #000), inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow:0 2px 0 rgba(0,0,0,.3); transition:transform .08s, opacity .2s; white-space:nowrap; }
  .bb:active { transform:translateY(3px) scale(.95); box-shadow:0 1px 0 color-mix(in srgb, var(--brand-primary,#c62828) 55%, #000); }
  .bb.off { opacity:.5; }
  .bb small { font-size:11px; opacity:.85; }
  .bb.glow { animation:glow .8s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 18px 5px color-mix(in srgb, var(--brand-accent,#ffd54f) 85%, transparent); transform:scale(1.07); } }
  body.over #bar { opacity:0; transition:opacity .3s; }
  @media (max-width:440px) { #bar { gap:8px; } .bb { min-width:0; flex:1; max-width:104px; padding:0 6px; font-size:14px; } }

  #banner { position:fixed; left:50%; top:46%; transform:translate(-50%,-50%) scale(.5); z-index:8; pointer-events:none; text-align:center; font-size:clamp(28px, 7vw, 48px); color:#fff; max-width:94vw; font-weight:900;
    text-shadow:0 3px 0 var(--brand-primary,#c62828), 0 6px 0 rgba(0,0,0,.3), 0 0 26px rgba(255,255,255,.45); opacity:0; transition:opacity .18s, transform .4s cubic-bezier(.2,1.8,.4,1); white-space:nowrap; }
  #banner.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #banner small { display:block; font-size:.42em; color:var(--brand-accent,#ffd54f); margin-top:4px; text-shadow:0 2px 0 rgba(0,0,0,.45); }
  #pops { position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .pop { position:absolute; transform:translate(-50%,-50%); font-size:22px; color:#fff; text-shadow:0 2px 0 var(--brand-primary,#c62828), 0 0 8px rgba(0,0,0,.45); animation:up 1s cubic-bezier(.2,.9,.3,1) forwards; white-space:nowrap; font-weight:900; }
  .pop small { font-size:.7em; color:var(--brand-accent,#ffd54f); }
  .pop.t { color:#bfe6ff; text-shadow:0 2px 0 #1d4f7a; font-size:18px; }
  @keyframes up { 0% { opacity:0; transform:translate(-50%,-30%) scale(.4); } 18% { opacity:1; transform:translate(-50%,-60%) scale(1.25); } 35% { transform:translate(-50%,-80%) scale(1); } 100% { opacity:0; transform:translate(-50%,-200%) scale(.9); } }
  #hand { position:fixed; z-index:5; pointer-events:none; width:46px; height:46px; margin:-6px 0 0 -14px; left:0; top:0; }
  #hand svg { width:46px; height:46px; filter:drop-shadow(0 3px 2px rgba(0,0,0,.45)); animation:tap .9s ease-in-out infinite; }
  @keyframes tap { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(10px) scale(.9); } }
  #toast { position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(10px); z-index:9; background:#fffaf0; color:#4a2a10; font-size:14px; padding:9px 16px; border-radius:14px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap; box-shadow:0 0 0 2px var(--brand-primary,#c62828), 0 4px 0 rgba(0,0,0,.3); }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #flash { position:fixed; inset:0; z-index:4; pointer-events:none; background:#fff; opacity:0; }
  #loading { position:fixed; inset:0; z-index:9000; background:#2a160d; }
  @media (max-height:520px) { .bb { height:40px; font-size:14px; } #bar { padding-top:4px; padding-bottom:calc(6px + env(safe-area-inset-bottom)); } }
</style>

<body>
<canvas id="c"></canvas>
<div id="loading"></div>
<div id="score" hidden><b id="scoreN">0</b><small id="batchN">Batch 1</small></div>
<div id="bar" hidden>
  <button class="bb" id="undoBtn" aria-label="Undo (U)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
  <button class="bb" id="hintBtn" aria-label="Hint (H)"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Hint<small>-3s</small></button>
  <button class="bb" id="skipBtn" aria-label="New batch (N)"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>New</button>
</div>
<div id="pops"></div>
<div id="hand" hidden><svg viewBox="0 0 48 48"><path d="M18 44c-4-3-9-9-11-13-1-2 1-4 3-3l5 4V9a3 3 0 0 1 6 0v12h1v-4a3 3 0 0 1 6 0v4h1v-3a3 3 0 0 1 6 0v4h1v-2a3 3 0 0 1 5 0v11c0 6-3 10-6 12z" fill="#fff" stroke="#3a2414" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
<div id="banner"></div>
<div id="flash"></div>
<div id="toast"></div>

<script src="logic.js"></script>
<script>
// Cocoa Sort: a 90-second holiday score attack built on the Corkpop pouring engine (logic.js = rules, solver, generator).
(() => {
'use strict';
const B = window.BrewLogic;
const $ = id => document.getElementById(id);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const fmt = n => Math.floor(n).toLocaleString('en-US');
const ROUND_S = 90, TITLE = 'Cocoa Sort';

HKit.init({ slug: 'sort', title: TITLE, subtitle: 'Pour, sort & serve cozy holiday drinks' });
let BR = HKit.brand();

let toastT; function toast(m) { const t = $('toast'); t.innerHTML = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }
let bannerN = 0; function banner(m, ms = 1300, sub = '') { const b = $('banner'); b.innerHTML = m + (sub ? `<small>${sub}</small>` : ''); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); const id = ++bannerN; later(ms / 1000, () => { if (id === bannerN) b.classList.remove('on'); }); }
function popText(x, y, html, cls = '') { const e = document.createElement('div'); e.className = 'pop ' + cls; e.innerHTML = html; e.style.left = x + 'px'; e.style.top = y + 'px'; $('pops').appendChild(e); setTimeout(() => e.remove(), 1000); }

// ================= Holiday drinks (each has a candy symbol so colours never rely on hue alone) =================
const COLORS = [
  ['#ff3b5c', 'Cranberry'], ['#ff9324', 'Gingerbread'], ['#ffdc3a', 'Eggnog'], ['#7be04a', 'Mint'], ['#17c9a0', 'Spruce'], ['#40c8ff', 'Frost'],
  ['#3d63f5', 'Blueberry'], ['#9b58ff', 'Plum'], ['#ff6ccc', 'Peppermint'], ['#f1eefc', 'Snow Milk'], ['#a8663a', 'Cocoa'], ['#45406a', 'Licorice'],
].map(([hex, name], i) => {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const mix = k => '#' + [r, g, b].map(v => Math.round(clamp(k > 0 ? v + (255 - v) * k : v * (1 + k), 0, 255)).toString(16).padStart(2, '0')).join('');
  return { hex, name, light: mix(0.45), dark: mix(-0.35), glow: `rgba(${r},${g},${b},` };
});
const HIDDEN = { hex: '#5c7fae', light: '#a8c8ee', dark: '#2f4c78', glow: 'rgba(150,200,255,' }; // frosted layer
function rune(g, k, x, y, r) { // candy symbol per colour, drawn white
  g.beginPath();
  switch (k) {
    case 0: g.arc(x, y, r * 0.75, 0, 7); break;
    case 1: g.moveTo(x, y - r); g.lineTo(x + r * 0.9, y + r * 0.7); g.lineTo(x - r * 0.9, y + r * 0.7); g.closePath(); break;
    case 2: g.rect(x - r * 0.7, y - r * 0.7, r * 1.4, r * 1.4); break;
    case 3: g.moveTo(x, y - r); g.lineTo(x + r * 0.8, y); g.lineTo(x, y + r); g.lineTo(x - r * 0.8, y); g.closePath(); break;
    case 4: for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); break;
    case 5: for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; g.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } break; // snowflake
    case 6: g.arc(x, y, r * 0.8, 0.6, 5.7); g.arc(x + r * 0.35, y, r * 0.55, 5.5, 0.8, true); g.closePath(); break;
    case 7: g.moveTo(x, y + r * 0.85); g.bezierCurveTo(x - r * 1.3, y - r * 0.2, x - r * 0.5, y - r * 1.1, x, y - r * 0.35); g.bezierCurveTo(x + r * 0.5, y - r * 1.1, x + r * 1.3, y - r * 0.2, x, y + r * 0.85); break;
    case 8: g.moveTo(x, y - r); g.quadraticCurveTo(x + r, y + r * 0.2, x, y + r * 0.9); g.quadraticCurveTo(x - r, y + r * 0.2, x, y - r); break;
    case 9: g.arc(x, y, r * 0.8, 0, 7); g.moveTo(x + r * 0.35, y); g.arc(x, y, r * 0.35, 0, 7, true); break;
    case 10: for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); } g.closePath(); break;
    case 11: g.moveTo(x + r * 0.2, y - r); g.lineTo(x - r * 0.6, y + r * 0.1); g.lineTo(x, y + r * 0.1); g.lineTo(x - r * 0.2, y + r); g.lineTo(x + r * 0.6, y - r * 0.1); g.lineTo(x, y - r * 0.1); g.closePath(); break;
  }
  if (k === 5) g.stroke(); else g.fill();
}

// ================= Glass mug shape (liquid levels are computed from real area, so the shape pours correctly) =================
const MUG = { w: 60, h: 126, rim: '#f4fbff', tint: 'rgba(225,240,255,0.12)' };
const FILL = 0.8;
function makePoly(st) {
  const w = st.w, h = st.h, r = w / 2, c = 14, p = [-r, -h, r, -h, r, -c];
  for (let k = 1; k < 4; k++) { const a = k / 4 * Math.PI / 2; p.push(r - c + Math.cos(a) * c, -c + Math.sin(a) * c); }
  p.push(r - c, 0, -r + c, 0);
  for (let k = 1; k < 4; k++) { const a = Math.PI / 2 + k / 4 * Math.PI / 2; p.push(-r + c + Math.cos(a) * c, -c + Math.sin(a) * c); }
  p.push(-r, -c);
  return { pts: new Float32Array(p), w, h, n: p.length / 2 };
}
// area of the part of polygon (flat xy array, n points) that lies below the horizontal line y = L (screen y grows downward); no allocations
function areaBelow(P, n, L) {
  let A = 0, fx = 0, fy = 0, lx = 0, ly = 0, has = false;
  const emit = (x, y) => { if (!has) { fx = x; fy = y; has = true; } else A += lx * y - x * ly; lx = x; ly = y; };
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, px = P[i * 2], py = P[i * 2 + 1], qx = P[j * 2], qy = P[j * 2 + 1], pin = py >= L, qin = qy >= L;
    if (pin && qin) emit(qx, qy);
    else if (pin && !qin) { const t = (L - py) / (qy - py); emit(px + (qx - px) * t, L); }
    else if (!pin && qin) { const t = (L - py) / (qy - py); emit(px + (qx - px) * t, L); emit(qx, qy); }
  }
  if (has) A += lx * fy - fx * ly;
  return Math.abs(A) / 2;
}
const bnd = { minY: 0, maxY: 0, minX: 0, maxX: 0 };
function polyBounds(P, n) { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; for (let i = 0; i < n; i++) { const x = P[i * 2], y = P[i * 2 + 1]; if (y < a) a = y; if (y > b) b = y; if (x < c) c = x; if (x > d) d = x; } bnd.minY = a; bnd.maxY = b; bnd.minX = c; bnd.maxX = d; return bnd; }
function levelFor(P, n, A) { // y of the liquid surface holding area A
  polyBounds(P, n); let lo = bnd.minY, hi = bnd.maxY; if (A <= 0) return hi;
  for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (areaBelow(P, n, m) > A) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const tmpP = new Float32Array(64);
function rotInto(out, src, n, a, s) { const c = Math.cos(a), si = Math.sin(a); for (let i = 0; i < n; i++) { const x = src[i * 2] * s, y = src[i * 2 + 1] * s; out[i * 2] = x * c - y * si; out[i * 2 + 1] = x * si + y * c; } }
// smallest tilt at which liquid of area A reaches the lip (dir +1: tilting right, lip = top-right corner)
function lipAngle(poly, A, dir) {
  let lo = 0, hi = 2.1; const lx = dir > 0 ? poly.pts[2] : poly.pts[0], ly = -poly.h;
  for (let k = 0; k < 16; k++) {
    const m = (lo + hi) / 2, a = m * dir; rotInto(tmpP, poly.pts, poly.n, a, 1);
    const L = levelFor(tmpP, poly.n, A), lipY = lx * Math.sin(a) + ly * Math.cos(a);
    if (L <= lipY + 0.5) hi = m; else lo = m;
  }
  return hi * dir;
}
const poly = makePoly(MUG), UA = areaBelow(poly.pts, poly.n, -poly.h * FILL) / 4;

// ================= Pour sounds (routed through the holiday kit's mixer so the mute button covers everything) =================
const AU = HKit.audio;
const Sound = {
  ctx: null, out: null,
  init() {
    const c = AU.ensure(); if (!c) return;
    if (!this.ctx) { this.ctx = c; this.out = c.createGain(); this.out.gain.value = 0.75; this.out.connect(AU.fx); }
    if (c.state !== 'running' && !AU.muted && !document.hidden) c.resume();
  },
  ok() { return this.ctx && this.ctx.state === 'running' && !AU.muted; },
  tone(f, d, type = 'sine', v = 0.2, delay = 0, slide = 0) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + 0.05);
  },
  // the pour: a filtered rush whose pitch rises as the mug fills, plus little glugs
  pourStart() {
    if (!this.ok()) return null;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = AU.noise; s.loop = true; f.type = 'bandpass'; f.Q.value = 6; f.frequency.value = 500; g.gain.value = 0.0001;
    s.connect(f); f.connect(g); g.connect(this.out); s.start();
    g.gain.exponentialRampToValueAtTime(0.16, this.ctx.currentTime + 0.08);
    return { s, f, g };
  },
  pourSet(h, fill) { if (h) h.f.frequency.setTargetAtTime(420 + fill * 1500, this.ctx.currentTime, 0.05); },
  pourEnd(h) { if (!h) return; const t = this.ctx.currentTime; h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(Math.max(0.0001, h.g.gain.value), t); h.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); h.s.stop(t + 0.15); },
  glug(fill) { this.tone(260 + fill * 520 + Math.random() * 60, 0.07, 'sine', 0.08, 0, 1.8); },
  select(k = 0) { this.tone(520 + k * 25, 0.06, 'triangle', 0.09); this.tone(780 + k * 37, 0.05, 'sine', 0.05, 0.03); },
  drop() { this.tone(420, 0.06, 'triangle', 0.06); },
  reveal() { this.tone(500, 0.25, 'sine', 0.07, 0, 2.2); },
};

// ================= Brand logo (cached round sticker) =================
let logoC = null;
function refreshLogo() {
  if (!window.Brand || !Brand.logoImage) return;
  Brand.logoImage().then(img => {
    const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.beginPath(); g.arc(64, 64, 64, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(64, 64, 59, 0, 7); g.clip();
    const ar = (img.naturalWidth || img.width) / (img.naturalHeight || img.height) || 1; let w = 112, h = 112 / ar; if (h > 112) { h = 112; w = 112 * ar; }
    g.drawImage(img, 64 - w / 2, 64 - h / 2, w, h); g.restore();
    logoC = c; buildBg();
  }).catch(() => {});
}

// ================= Canvas / layout =================
const cv = $('c'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1, hudB = 84, bandH = 0, area = { x: 0, y: 0, w: 0, h: 0 }, portrait = false, S0 = 1, slotW = 0, rowH = 0, win = { x: 0, y: 0, w: 0, h: 0 };
let views = [], S = null, L = null;
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); bg.width = cv.width; bg.height = cv.height;
  portrait = H > W * 1.05; document.body.classList.toggle('portrait', portrait);
  hudB = portrait ? 132 : 84;
  bandH = portrait ? clamp(H * 0.3, hudB + 80, hudB + 150) : clamp(H * 0.36, hudB + 70, hudB + 130);
  if (timer) timer.el.style.top = `calc(${portrait ? 86 : 38}px + env(safe-area-inset-top))`;
  const barH = ($('bar').offsetHeight || 64) + 4;
  area = { x: 8, y: bandH + 8, w: W - 16, h: H - bandH - barH - 8 };
  const n = Math.max(1, views.length), fw = MUG.w + 34, fh = MUG.h + 50;
  let best = 0, bestR = 1;
  for (let r = 1; r <= 4; r++) { const per = Math.ceil(n / r), sw = area.w / per, rh = area.h / r, s = Math.min(sw / (fw * 1.18), rh / (fh * 1.1)); if (s > best + 0.02) { best = s; bestR = r; } }
  S0 = Math.min(best, 1.3);
  const rows = bestR, per = Math.ceil(n / rows); slotW = area.w / per; rowH = area.h / rows;
  let k = 0;
  for (let r = 0; r < rows; r++) {

    const mouthX = vb.hx, mouthY = vb.hy - poly.h * S0, ppx = mouthX - p.dir * poly.w * 0.18 * S0, ppy = mouthY - 16 * S0;
    const lipLx = p.dir > 0 ? poly.pts[2] : poly.pts[0], lipLy = poly.pts[1];
    let ang, amtLeft;
    if (p.t < t1) { amtLeft = p.srcAmt0; const e = easeInOut(p.t / t1); ang = lipAngle(poly, amtLeft * UA, p.dir) * e * 0.96; const c = Math.cos(ang), s = Math.sin(ang); const lx = (lipLx * c - lipLy * s) * S0, ly = (lipLx * s + lipLy * c) * S0; va.x = lerp(va.hx, ppx - lx, e); va.y = lerp(va.hy, ppy - ly, e); va.lift = 0; }
    else if (p.t < t2) {
      if (!p.streamOn && !p.started) { p.started = true; p.streamOn = true; p.headT = 0; p.h = Sound.pourStart(); }
      const e = (p.t - t1) / p.dur, pe = clamp(e * 1.08 - 0.04, 0, 1); p.poured = p.n * pe; amtLeft = p.srcAmt0 - p.poured;
      drainSrc(p, va, p.poured);
      p.tl.amt = (p.tl.amt0 === undefined ? (p.tl.amt0 = p.tl.amt) : p.tl.amt0) + p.poured;
      ang = lipAngle(poly, Math.max(0.05, amtLeft) * UA, p.dir) + 0.05 * p.dir; ang = clamp(ang, -2.05, 2.05);
      const c = Math.cos(ang), s = Math.sin(ang); va.x = ppx - (lipLx * c - lipLy * s) * S0; va.y = ppy - (lipLx * s + lipLy * c) * S0;
      p.headT += dt; p.flow = Math.min(1, e * 6) * Math.min(1, (1 - e) * 6);
      vb.wave = Math.max(vb.wave, 0.5); vb.slv += (Math.random() - 0.5) * 0.3;
      const fill = (p.tgtAmt0 + p.poured) / 4; Sound.pourSet(p.h, fill); p.glugT -= dt; if (p.glugT <= 0) { p.glugT = 0.06 + Math.random() * 0.06; Sound.glug(fill); }
      if (Math.random() < 0.7) emit(vb.x + (Math.random() - 0.5) * 10 * S0, vb.surf, 1, [COLORS[p.c].light, COLORS[p.c].hex, '#ffffff'], { ang: -Math.PI / 2, spread: 1.6, sp: 130 * S0, g: 700, life: 0.35, size: 2.6 * S0 });
    } else if (p.t < t3) {
      if (p.streamOn) { p.streamOn = false; p.tail = 0.14; Sound.pourEnd(p.h); p.h = null; finishPourVisual(p); va.wave = 0.7; vb.busy = Math.max(0, vb.busy - 1); p.freedB = true; runQueue(); }
      const e = easeInOut((p.t - t2) / p.back); ang = (p.endAng ?? (p.endAng = va.a)) * (1 - e); va.x = lerp(p.endX ?? (p.endX = va.x), va.hx, e); va.y = lerp(p.endY ?? (p.endY = va.y), va.hy, e);
    } else {
      va.x = va.hx; va.y = va.hy; va.pour = null; va.busy = Math.max(0, va.busy - 1); if (!p.freedB) vb.busy = Math.max(0, vb.busy - 1); pours.splice(k, 1); va.sl += 0.25 * p.dir;
      runQueue(); afterMove(); va.a = 0; continue;
    }
    if (p.tail > 0) p.tail -= dt;
    va.a = ang;
    const c = Math.cos(ang), s = Math.sin(ang); p.lipX = va.x + (lipLx * c - lipLy * s) * S0; p.lipY = va.y + (lipLx * s + lipLy * c) * S0;
  }
  updateParts(dt);
  // idle nudge: after a while without a move, gently glow a good move (free)
  if (state === 'play' && !hintMove && T - lastMoveAt > 9 && !pours.length) { lastMoveAt = T; const h = nextMove(); if (h) views[h[0]].glow = 1.2; }
}
function drainSrc(p, va, poured) { let rem = poured; for (let k = va.layers.length - 1; k >= 0; k--) { const a0 = p.sAm[k] ?? 0, a = Math.max(0, a0 - rem); va.layers[k].amt = a; rem -= a0 - a; if (rem <= 0) break; } }
function runQueue() { while (queue.length) { const [a, b] = queue[0]; if (views[a].busy || views[b].busy || views[b].cork >= 0) return; queue.shift(); if (B.canPour(S, a, b)) startPour(a, b); } }
function afterMove() {
  hud();
  if (state === 'play' && !pours.length && !queue.length && !B.won(S) && !views.some(v => v.cork >= 0 || v.fly) && !B.anyMove(S)) {
    later(0.4, () => { if (state === 'play' && !B.anyMove(S) && !pours.length) { toast('No pours left: Undo or New batch'); HKit.sfx.error(); stuckGlow(true); } });
  } else stuckGlow(false);
}
function startFly(v) {
  const r = $('score').getBoundingClientRect(), x1 = r.left + r.width / 2, y1 = r.top + r.height * 0.7;
  v.fly = { t: 0, dur: 0.55, x0: v.x, y0: v.y, x1, y1, cx: (v.x + x1) / 2, cy: Math.min(v.y, y1) - 60 * S0, s: 1, s1: 0.16, dir: x1 > v.x ? 1 : -1 };
}
function arrive() { const s = $('score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); HKit.sfx.combo(Math.min(10, chain + 1)); const r = s.getBoundingClientRect(); emit(r.left + r.width / 2, r.bottom, 12, confettiCols(), { sp: 120, g: 200, life: 0.6, size: 3, type: 1 }); }

// ================= Render =================
let kbUsed = false;
function render() {
  const shx = shakeAmt ? (Math.random() - 0.5) * shakeAmt : 0, shy = shakeAmt ? (Math.random() - 0.5) * shakeAmt : 0;
  ctx.setTransform(DPR, 0, 0, DPR, shx * DPR, shy * DPR);
  ctx.drawImage(bg, 0, 0, W, H);
  drawDecor();
  for (const v of views) if (!v.gone && !v.pour && !v.fly) drawFlask(v);
  for (const v of views) if (!v.gone && v.pour) drawFlask(v);
  for (const p of pours) drawStream(p);
  if (kbUsed && state === 'play' && views[kc] && !views[kc].gone) { const v = views[kc]; ctx.strokeStyle = BR.accent; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.roundRect(v.hx - slotW * 0.44, v.hy - (poly.h + 40) * S0 - v.lift, slotW * 0.88, (poly.h + 52) * S0, 12); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = BR.accent; ctx.font = `900 ${Math.round(13 * Math.max(0.8, S0))}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(30,12,4,.85)'; ctx.strokeText(String((kc + 1) % 10), v.hx, v.hy + 8 * S0); ctx.fillText(String((kc + 1) % 10), v.hx, v.hy + 8 * S0); }
  for (const v of views) if (!v.gone && v.fly) drawFlask(v);
  drawParts();
  placeHand();
}

// ================= Input wiring =================
let down = null;
cv.addEventListener('pointerdown', e => {
  Sound.init(); kbUsed = false; if (state !== 'play') return;
  const i = flaskAt(e.clientX, e.clientY); down = { x: e.clientX, y: e.clientY, i, moved: false };
  if (i >= 0) { if (selected < 0) tapFlask(i); else if (i !== selected) { tapFlask(i); down.i = -1; } else down.same = true; }
  else if (selected >= 0) { views[selected].sel = false; selected = -1; Sound.drop(); }
});
cv.addEventListener('pointermove', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 18) down.moved = true; });
addEventListener('pointerup', e => {
  if (!down) return; const d = down; down = null; if (state !== 'play') return;
  if (d.moved && selected >= 0) { const j = flaskAt(e.clientX, e.clientY); if (j >= 0 && j !== selected) tapFlask(j); return; } // drag to pour
  if (d.same && !d.moved) tapFlask(d.i); // second tap on the same mug puts it down
});
addEventListener('keydown', e => {
  Sound.init(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyM') { const m = $('hk-mute'); if (m) m.click(); return; }
  if (state !== 'play') return;
  const vis = views.filter(v => !v.gone && !v.fly).map(v => v.i); if (!vis.length) return;
  let ci = vis.indexOf(kc); if (ci < 0) ci = 0;
  const kl = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1 }[e.code];
  if (kl) { kbUsed = true; kc = vis[(ci + kl + vis.length) % vis.length]; HKit.sfx.tick(0.4); return; }
  if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'ArrowDown' || e.code === 'KeyS') { kbUsed = true; const v = views[kc], dr = (e.code === 'ArrowUp' || e.code === 'KeyW') ? -1 : 1; const cand = vis.filter(i => views[i].row === v.row + dr); if (cand.length) kc = cand.reduce((b, i) => Math.abs(views[i].hx - v.hx) < Math.abs(views[b].hx - v.hx) ? i : b, cand[0]); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') { kbUsed = true; tapFlask(kc); return; }
  const dg = /^(?:Digit|Numpad)(\d)$/.exec(e.code); if (dg) { const d = +dg[1], i = d === 0 ? 9 : d - 1; if (views[i] && !views[i].gone) { kbUsed = true; kc = i; tapFlask(i); } return; }
  if (e.code === 'KeyU' || e.code === 'Backspace' || e.code === 'KeyZ') { undo(); return; }
  if (e.code === 'KeyH') { hint(); return; }
  if (e.code === 'KeyN') { skip(); return; }
});
addEventListener('blur', () => { down = null; });
for (const [id, fn] of [['undoBtn', undo], ['hintBtn', hint], ['skipBtn', skip]]) {
  $(id).addEventListener('pointerdown', e => e.stopPropagation());
  $(id).onclick = () => { Sound.init(); HKit.sfx.click(); fn(); };
}

// ================= Main loop =================
let lastF = 0, speed = 1;
function frame(now) {
  const dt = Math.min(0.05, (now - (lastF || now)) / 1000) * speed; lastF = now;
  update(dt); render();
  requestAnimationFrame(frame);
}

// ================= Boot =================
HKit.onBrand(b => { BR = b; refreshLogo(); buildBg(); });
refreshLogo();
const splash = HKit.splash({ title: TITLE, sub: 'Pour, sort & serve cozy holiday drinks' });
timer = HKit.timer({ seconds: ROUND_S, onEnd: endRound });
HKit.lights({ z: 55 });
HKit.snow({ z: 2, count: 40 });
HKit.badge({ corner: 'tl', style: 'top:calc(38px + env(safe-area-inset-top))' });
HKit.muteButton({ corner: 'tr', style: 'top:calc(38px + env(safe-area-inset-top))' });
HKit.music.start();
$('score').hidden = false; $('bar').hidden = false;
nextL = { k: 0, L: genPuzzle(0) };
layout(); requestAnimationFrame(frame);
HKit.ready();
splash.then(() => {
  startRound();
  const hk = HKit.hint(IS_TOUCH ? 'Tap a mug, then tap another to pour<small>Same drink on top &middot; fill a mug to serve it</small>'
    : 'Click a mug, then another to pour<small>Same drink on top &middot; keys 1-9 or arrows + Space</small>', 3000, 'tap');
  const hh = hk.el.querySelector('.hk-hand'); if (hh) hh.remove(); // the guide hand points at the real mugs instead
});

// test hooks
window.__game = {
  get: () => ({ state, score, batch, solved, mugs, moves: S && S.moves, par: L && L.par, colors: S && S.P.colors, mugsOnTable: views.length, left: timer.left(), selected }),
  pour: (a, b) => { tapFlask(a); tapFlask(b); },
  step() { if (state !== 'play' || pours.length || queue.length || views.some(v => v.cork >= 0)) return false; const h = nextMove(); if (!h) { skip(); return 'skip'; } tapFlask(h[0]); tapFlask(h[1]); return h; },
  endNow: () => timer.endNow(),
  go: k => { if (state === 'play' || state === 'clear') startPuzzle(k); return __game.get(); },
  speed: s => { speed = s; },
};
})();
</script>
