function topple() {

// ===== FX helpers =====
const rings = [], ringGeo = new THREE.PlaneGeometry(1, 1);

const pops = [];

// ===== HUD =====
let hudKey = '';
function hud() {

function applyBrand(b) {

// ===== Loop =====
function update(dt, rdt) {

let frameN = 0;
function render(dt) {

// ===== Input =====

addEventListener('keydown', e => {

});
$('muteBtn').onclick = () => { Sound.init(); Sound.setMuted(!Sound.muted); $('muteBtn').textContent = Sound.muted ? '🔇' : '🔊'; $('muteBtn').blur(); }; $('muteBtn').textContent = Sound.muted ? '🔇' : '🔊';

// ===== Test hooks =====
