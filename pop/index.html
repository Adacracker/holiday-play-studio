  const wp = jelly.localToWorld(v3.set(0, 2, 0));

  setTimeout(() => HKit.sfx.sparkle(), 300);
  const row = (k, v) => `<div class="hs-row"><span>${k}</span><b>${v}</b></div>`;
  const extra = row('Gifts unwrapped', R.gifts) + row('Bubbles popped', R.pops) + row('Best combo', '×' + R.best) + (R.logos ? row('Logo bonuses', R.logos) : '');
  setTimeout(() => { timer.el.hidden = true; HKit.end(R.score, extra).then(() => { HKit.sfx.click(); startRound(); }); }, 1300);
}

// ================= Input: mouse / touch / keyboard =================
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), inv = new THREE.Matrix4(), pl = new THREE.Vector3(), pd = new THREE.Vector3();
const ptrs = new Map();
function localHit(cx, cy) { // pointer → point on the toy's top plane (toy space)
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  jelly.updateMatrixWorld(); inv.copy(jelly.matrixWorld).invert(); pl.copy(ray.ray.origin).applyMatrix4(inv); pd.copy(ray.ray.direction).transformDirection(inv);
  if (Math.abs(pd.y) < 1e-4) return null; const k = (toy.top - pl.y) / pd.y; if (k < 0) return null; return [pl.x + pd.x * k, pl.z + pd.z * k];
}
canvas.addEventListener('pointerdown', e => {
  Sound.init(); kbOn(false);
  if (state !== 'play' || !toy || flipping) return;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  const h = localHit(e.clientX, e.clientY), p = { x0: e.clientX, y0: e.clientY, last: -1 }; ptrs.set(e.pointerId, p);
  if (flipReady) { if (h && Math.hypot(h[0], h[1]) < 4.5) doFlip(); return; }
  if (!h) return; const i = toy.pick(h[0], h[1]); if (i < 0) return;
  p.last = i; popAt(i, h[0], h[1]);
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || state !== 'play' || !toy) return;
  if (flipReady && p.y0 - e.clientY > 45 && !flipping) { doFlip(); return; }
  if (flipping) return;
  const h = localHit(e.clientX, e.clientY); if (!h) return;
  const i = toy.pick(h[0], h[1]); if (i >= 0 && i !== p.last) { p.last = i; if (!toy.targets[i].s) popAt(i, h[0], h[1]); }
});
const endPtr = e => ptrs.delete(e.pointerId);
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
// keyboard: arrows / WASD move a cursor ring, Space or Enter pops (and flips)
let kbI = -1, kbActive = false;
function kbOn(on) { kbActive = on; kbRing.visible = on && !!toy && state === 'play'; }
function kbMove(dx, dz) {
  if (!toy) return; kbOn(true); const T = toy.targets; if (kbI < 0 || kbI >= T.length) { kbI = T.findIndex(t => !t.s); if (kbI < 0) kbI = 0; return; }
  const c = T[kbI]; let bi = -1, bd = 1e9; for (let i = 0; i < T.length; i++) { if (i === kbI) continue; const ex = T[i].x - c.x, ez = T[i].z - c.z, along = ex * dx + ez * dz; if (along < 0.3) continue; const side = Math.abs(ex * dz - ez * dx), d = along + side * 2.2 + (T[i].s ? 0.6 : 0); if (d < bd) { bd = d; bi = i; } } if (bi >= 0) { kbI = bi; Sound.tick(); }
}
function kbPress() {
  if (!toy || state !== 'play') return; if (flipReady) { doFlip(); return; }
  if (flipping) return;
  kbOn(true); const T = toy.targets;
  const best = from => { let bi = -1, bd = 1e9; const c = T[from] || T[0]; for (let i = 0; i < T.length; i++) { if (T[i].s) continue; let d = Math.hypot(T[i].x - c.x, T[i].z - c.z); if (T[i].hi >= 1) d -= 100; if (T[i].gold) d -= 50; if (d < bd) { bd = d; bi = i; } } return bi; };
  if (kbI < 0 || kbI >= T.length || T[kbI].s) kbI = best(kbI);
  if (kbI < 0) return;
  const i = kbI; popAt(i, T[i].x, T[i].z); if (toy && toy.targets === T) { const n = best(i); if (n >= 0) kbI = n; }
}
const DIRS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
addEventListener('keydown', e => {
  Sound.init(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyM') { $('hk-mute') && $('hk-mute').click(); return; }
  if (state !== 'play') return;
  if (DIRS[e.code]) { kbMove(...DIRS[e.code]); return; }
  if (e.code === 'Space' || e.code === 'Enter') { kbPress(); return; }
  if (e.code === 'KeyF') { doFlip(); return; }
});
addEventListener('blur', () => ptrs.clear());
$('flipBtn').onclick = () => { Sound.init(); doFlip(); };
$('flipBtn').addEventListener('pointerdown', e => e.stopPropagation());

// ================= Camera rig: the toy always fits between the HUD rows =================
const camPos = new THREE.Vector3(0, 8, 16), camLook = new THREE.Vector3(0, 2, 0), tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
function viewFor() {
  const w = innerWidth, h = innerHeight, asp = w / h, port = asp < 0.85;
  const fov = port ? 50 : 40, vt = Math.tan(fov * Math.PI / 360); camera.fov = fov;
  const topUI = h < 520 ? 76 : port ? 118 : 100, botUI = port ? 150 : h < 520 ? 62 : 96;
  const availV = Math.max(0.3, (h - topUI - botUI) / h), halfV = Math.atan(vt * availV), halfH = Math.atan(vt * asp * 0.92);
  const R0 = 3.75, D = R0 / Math.sin(Math.min(halfV, halfH)), E = port ? 0.42 : 0.36;
  let offPx = (topUI - botUI) / 2;
  if (port) { const toyPx = R0 / (D * vt) * h / 2; const free = (h - topUI - botUI) - toyPx * 2; offPx += Math.max(0, free) * 0.42; }
  const up = v3.set(0, Math.cos(E), -Math.sin(E)), wpp = 2 * D * vt / h;
  tLook.copy(TOY_POS).addScaledVector(up, offPx * wpp); tPos.copy(tLook).add(v4.set(0, Math.sin(E) * D, Math.cos(E) * D));
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; viewFor(); camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

// ================= Main loop =================
function update(dt) {
  t += dt; U_TIME.value = t;
  if (state === 'play') {
    roundT += dt;
    if (R.combo && (R.ct -= dt) <= 0) { R.combo = 0; comboHud(); }
    if (flipReady && !flipping && (autoFlipT -= dt) <= 0) doFlip();
  }
  if (toy) toy.update(dt);
  updFlip(dt); updJelly(dt); updParts(dt); updRoom(dt); updLogoBubble(dt);
  stage.position.y = TOY_POS.y + Math.sin(t * 1.3) * 0.07; stage.rotation.z = Math.sin(t * 0.6) * 0.025;
  if (kbRing.visible && toy && kbI >= 0 && toy.targets[kbI]) { const tg = toy.targets[kbI]; kbRing.position.set(tg.x, toy.top + 0.12, tg.z); kbRing.scale.setScalar(1 + Math.sin(t * 8) * 0.06); }
  viewFor(); const k = 1 - Math.exp(-dt * 4.5); camPos.lerp(tPos, k); camLook.lerp(tLook, k);
  camera.position.copy(camPos); if (camShake > 0) { camShake = Math.max(0, camShake - dt); const s = camShake * 0.5; camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s; }
  camera.lookAt(camLook); camera.updateProjectionMatrix();
}
let last = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  if (hitStop > 0) { hitStop -= dt; dt *= 0.1; }
  update(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ================= Brand: live colours / logo / wrapping paper =================
function applyBrand(b) {
  brandPals(); if (toy && toy.def.pal[0] === 'b') toy.repal();
  kbRingMat.color.set(b.accent); bowMat.color.set(b.accent);
  brandHooks.forEach(f => f(b));
  Brand.logoImage().then(img => { logoImg = img; brandTex.forEach(f => f()); }).catch(() => {});
}

// ================= Boot =================
(async () => {
  if (window.__noWebGL) return;
  await nextFrame();
  try { logoImg = await Brand.logoImage(); } catch (e) { logoImg = null; }
  try { logoTex = await Brand.logoTexture(THREE); logoTex.colorSpace = THREE.SRGBColorSpace; } catch (e) { logoTex = null; }
  HKit.progress(0.35);
  buildRoom(); buildSticker(); HKit.progress(0.55); await nextFrame();
  TOYS.forEach(d => popGeo(d)); HKit.progress(0.85);
  HKit.onBrand(applyBrand);
  timer = HKit.timer({ seconds: ROUND_S, onEnd: endRound }); timer.el.hidden = true;
  HKit.snow({ z: 2, count: 40 }); HKit.lights({ z: 25 });
  HKit.badge({ corner: 'bl' }); HKit.muteButton({ corner: 'tr', style: 'top:calc(36px + env(safe-area-inset-top))' });
  HKit.music.start();
  setToy(TOYBY[SEQ[0]]); resize(); viewFor(); camPos.copy(tPos); camLook.copy(tLook);
  renderer.compile(scene, camera); renderer.render(scene, camera);
  requestAnimationFrame(frame);
  HKit.ready();
  await splashDone;
  startRound();
})();

// test hook
window.__game = {
  get state() { return state; }, get score() { return R.score; }, get flip() { return { ready: flipReady, auto: autoFlipT, f: flipping && flipping.t, id: toy && toy.def.id }; }, round: R, timer: () => timer,
  endNow() { timer && timer.endNow(); },
  counts: () => TOYS.map(d => d.id + ':' + popGeo(d).bubbles.length).join(' '),
  targets: () => toy ? toy.targets.map(tg => { const s = worldToScreen(jelly.localToWorld(v3.set(tg.x, toy.top, tg.z))); return { x: Math.round(s[0]), y: Math.round(s[1]), s: tg.s, hi: tg.hi, gold: tg.gold }; }) : [],
  popN(n) { let k = 0; for (const tg of (toy ? toy.targets : [])) { if (k >= n) break; if (!tg.s) { popAt(tg.i, tg.x, tg.z); k++; } } return k; },
  clearBoard() { if (toy) for (const tg of toy.targets) if (!tg.s) popAt(tg.i, tg.x, tg.z); },
  logoNow() { LB.next = 0; },
  show(id) { setToy(TOYBY[id]); },
};
</script>
