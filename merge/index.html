// ---- end of the round ----

  for (let i = 0; i < 6; i++) setTimeout(() => { emit((Math.random() - 0.5) * W, 4 + Math.random() * 8, 26, CONFETTI(), 9, 0.4, 1.2, -5); shock((Math.random() - 0.5) * 6, 4 + Math.random() * 6, 6, GOLD, 0.6); SFX.sparkle(); }, 250 + i * 230);

// ================= HUD / juice =================

// ================= Input =================

canvas.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  pointerDown = true; holdTX = worldX(e.clientX); if (IS_TOUCH || e.pointerType === 'touch') holdX = holdX + (holdTX - holdX) * 0.5;

addEventListener('keydown', e => {

addEventListener('blur', () => { keysDown.clear(); pointerDown = false; });

// ================= Layout =================
function resize() {

  const land = VW / VH > 1.05; document.body.classList.toggle('land', land);
  const top = land ? 40 : 162, bot = land ? 58 : 100, side = land ? Math.max(120, Math.min(260, VW * 0.22)) : 8;
  const H0 = -BASE_H - 0.25, H1 = 15.1, JW = (W + 0.8) * 1.09;

  jarL = toScreen(-HW - 0.35, 0).x; jarR = toScreen(HW + 0.35, 0).x; jarT = toScreen(0, H1).y; jarB = toScreen(0, H0).y;
  const rs = document.documentElement.style; rs.setProperty('--jl', jarL + 'px'); rs.setProperty('--jr', jarR + 'px'); rs.setProperty('--jt', jarT + 'px'); rs.setProperty('--jb', jarB + 'px');
  layoutHud(land); paintBg();
}
function layoutHud(land) {

  const chainW = 11 * (Math.min(28, (VW - 60) / 11) + 3) + 16;
  if (land && bd.getBoundingClientRect().right + 10 > (VW - chainW) / 2) HKit.badge({ corner: 'tl', style: `left:${Math.round(jarL / 2)}px;top:calc(168px + env(safe-area-inset-top));transform:translateX(-50%)` });
  HKit.muteButton({ corner: 'tr', style: 'top:calc(36px + env(safe-area-inset-top))' });
  if (timer) { const s = timer.el.style; if (land) { s.left = (jarL / 2) + 'px'; s.top = 'calc(42px + env(safe-area-inset-top))'; } else { s.left = ''; s.top = ''; } }

addEventListener('resize', resize);

// ================= Main loop =================
function setInst(mesh, i, x, y, z, sx, sy, sz, ang) {
  const a = mesh.instanceMatrix.array, o = i * 16, c = Math.cos(ang), s = Math.sin(ang);
  a[o] = sx * c; a[o + 1] = sx * s; a[o + 2] = 0; a[o + 3] = 0; a[o + 4] = -sy * s; a[o + 5] = sy * c; a[o + 6] = 0; a[o + 7] = 0;
  a[o + 8] = 0; a[o + 9] = 0; a[o + 10] = sz; a[o + 11] = 0; a[o + 12] = x; a[o + 13] = y; a[o + 14] = z; a[o + 15] = 1;
}
function setCol(mesh, i, r, g, b) { const a = mesh.instanceColor.array, o = i * 3; a[o] = r; a[o + 1] = g; a[o + 2] = b; }
function update(rdt) {

      const dv = Math.hypot(b.vx - b.lvx, b.vy - b.lvy);

}
function render() {
  const g = run ? run.glow : 0;
  for (let L = 0; L <= 10; L++) { itemMesh[L][0].count = 0; itemMesh[L][1].count = 0; }
  capMesh.count = loopMesh.count = glowMesh.count = 0; wispMesh.visible = holeMesh.visible = false;
  const danger = run && run.danger > 0.3 && state === 'play', blink = danger ? 0.5 + 0.5 * Math.sin(rt * 18) : 0;
  const drawItem = (l, x, y, s, sq, ang, happy, flash, isDanger) => {
    if (l === WISP) { wispMesh.visible = true; wispMesh.position.set(x, y, 0); wispMesh.scale.setScalar(s); wispMesh.rotation.z = ang; wispMat.emissiveIntensity = 0.6 + 0.3 * Math.sin(rt * 8); return; }
    if (l === HOLE) { holeMesh.visible = true; holeMesh.position.set(x, y, 0); holeMesh.scale.setScalar(s); holeMesh.rotation.z = Math.sin(rt * 3) * 0.12; holeRing.rotation.z = rt * 4; return; }
    const m = itemMesh[l][happy ? 1 : 0], i = m.count++; if (i >= MAXI) { m.count = MAXI; return; }

    if (isDanger) setCol(m, i, f + blink * 0.6, f * (1 - blink * 0.45), f * (1 - blink * 0.4)); else setCol(m, i, f, f, f);
    if (CAPPED.has(l) && capMesh.count < MAXI) { const sn = Math.sin(ang), cs = Math.cos(ang), hy = s * (1 - sq);
      setInst(capMesh, capMesh.count++, x - sn * 0.98 * hy, y + cs * 0.98 * hy, 0, s, s, s, ang); setInst(loopMesh, loopMesh.count++, x - sn * 1.22 * hy, y + cs * 1.22 * hy, 0, s, s, s, ang); }
    if (glowMesh.count >= MAXI + 4) return;
    const gi = glowMesh.count++, gl = (l === 9 ? 1.1 : 0.16) + g * 0.45 + flash * 1.2;
    const gc = glowCol[l]; setInst(glowMesh, gi, x, y, -0.15, s * 3.6, s * 3.6, 1, 0); setCol(glowMesh, gi, gc.r * gl, gc.g * gl, gc.b * gl);
  };
  for (const b of bodies) {
    if (b.dead) continue;
    const pop = b.pop > 0 ? 1 + Math.sin(b.pop * 9) * 0.22 * b.pop : 1, s = b.r * pop * (b.sk ? b.sc : 1);
    drawItem(b.l, b.x, b.y, s, b.sq, b.ang, b.happy > 0, b.flash, danger && b.y + b.r > LINE);
  }
  // held item + aim guide
  aim.visible = false;
  if (run && state === 'play' && !evt) {
    const r = radiusOf(run.cur), s = r * (heldScale < 1 ? 1 - Math.pow(1 - heldScale, 3) + Math.sin(heldScale * 3.14) * 0.15 : 1), y = DROPY + Math.sin(rt * 3) * 0.08;
    drawItem(run.cur, holdX, y, s, 0, Math.sin(rt * 1.7) * 0.15, cooldown > 0.2, 0, false);
    let land = 0; for (const b of bodies) { if (b.ghost || b.dead) continue; const dx = Math.abs(b.x - holdX); if (dx < b.r + r) { const top = b.y + Math.sqrt(Math.max(0, (b.r + r) * (b.r + r) - dx * dx)) - r; if (top > land) land = top; } }
    const y0 = y - r, y1 = land - r * 0.2; if (y0 > y1 + 0.2) { aim.visible = true; aim.position.set(holdX, (y0 + y1) / 2, -0.4); aim.scale.set(1, y0 - y1, 1); aimTex.repeat.set(1, (y0 - y1) * 1.2); aimTex.offset.y = -rt * 1.5; aimMat.color.copy(glowCol[Math.min(run.cur, 10)] || WHITE); }
  }
  for (let L = 0; L <= 10; L++) for (let hp = 0; hp < 2; hp++) { const m = itemMesh[L][hp]; if (m.count) { m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; } }
  capMesh.instanceMatrix.needsUpdate = loopMesh.instanceMatrix.needsUpdate = true; glowMesh.instanceMatrix.needsUpdate = true; glowMesh.instanceColor.needsUpdate = true;
  // particles

  sparkMesh.instanceMatrix.needsUpdate = true; sparkMesh.instanceColor.needsUpdate = true;
  ringFxMesh.count = rCount;
  for (let i = 0; i < rCount; i++) { const k = RF.t[i] / RF.max[i], e = 1 - Math.pow(1 - k, 3), s = RF.s[i] * (0.2 + 0.8 * e), a = (1 - k) * 1.3; setInst(ringFxMesh, i, RF.x[i], RF.y[i], 2.5, s, s, 1, 0); setCol(ringFxMesh, i, RF.r[i] * a, RF.g[i] * a, RF.b[i] * a); }

    const on = p.fire ? 0.55 + 0.25 * Math.sin(rt * 11) * Math.sin(rt * 7.3 + 1) + 0.15 * Math.sin(rt * 23) : p.star ? 0.55 + 0.25 * Math.sin(rt * 2) : 0.35 + 0.65 * Math.max(0, Math.sin(rt * 2.4 + i * 1.7 + (i % 3) * 2));

let last = 0, hudT = 0;
function frame(now) {

  update(dt); render(); hudT -= dt; if (run && (state === 'play' || state === 'ending')) { $('score').textContent = fmt(run.shown); if (hudT <= 0) { hudT = 0.25; hud(); } }

}

// ================= Brand =================

function rebuildBrandArt() {

  if (run && state !== 'loading') paintNext(true);
}
HKit.onBrand(() => { Brand.logoImage().then(img => { logoImg = img; requestAnimationFrame(rebuildBrandArt); }); });

// ================= Boot =================
(async () => {

  const plaque = makeMedal(); plaque.position.set(0, -BASE_H / 2, JZ + JD / 2 + 0.115); plaque.scale.setScalar(0.92); jar.add(plaque);
  const gm = makeMedal(); gm.position.z = 1.0; gm.scale.setScalar(0.95); grand.add(gm);
  timer = HKit.timer({ seconds: ROUND, onEnd: timeUp });
