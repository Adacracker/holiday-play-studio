  if (B.by >= 0) { const o = cars[B.by]; o.inner.scale.set(1.18, 0.78, 1.18); o.sq = 1; later(0.14, () => Sound.honk(o.type)); emit(lerp(c.g.position.x, o.g.position.x, 0.5), 0.9, lerp(c.g.position.z, o.g.position.z, 0.5), 10, ['#ffffff', '#ffe14a'], { spread: 3, up: 2.5, life: 0.4, size: 0.14 }); }
  else emit(c.g.position.x, 0.8, c.g.position.z, 6, ['#ffffff'], { spread: 2, up: 2, life: 0.35, size: 0.12 });
}
function updatePops() { for (const c of cars) if (c.pop) { const k = clamp((tNow - c.pop) / 0.35, 0, 1), s = Math.max(0.05, backOut(k)); c.inner.scale.set(s, s, s); if (k >= 1) { c.pop = 0; c.inner.scale.set(1, 1, 1); } } }

// ---------- lot cleared -> next lot ----------
function lotDone() {
  state = 'clear'; lotsCleared++;
  const n = Lg.veh.length, el = tNow - lvlT0, parT = 2.5 + n * 0.9;
  const speed = Math.max(0, Math.ceil(parT - el)) * 5, bonus = 25 + 5 * n + speed + bestCombo * 5;
  later(0.35, () => {
    addScore(bonus); timeLeft += LOT_TIME_BONUS; const tb = $('timerBox'); tb.classList.remove('bonus'); void tb.offsetWidth; tb.classList.add('bonus');
    banner(speed > 0 ? 'SPEEDY DELIVERY!' : 'LOT CLEARED!', 1100, `+${bonus} · +${LOT_TIME_BONUS}s`);
    Sound.fanfare();
    emit(0, 1, 0, 70, CONFETTI, { spread: Math.max(RG.hx, RG.hz) * 1.6, up: 7, upR: 5, g: 10, life: 1.6, size: 0.28, jit: RG.hx });
    $('flash').style.opacity = 0.3; setTimeout(() => $('flash').style.opacity = 0, 90);
  });
  later(1.25, () => { if (state !== 'clear') return; startLevel(lotNo + 1); state = 'play'; });
}

// ---------- hints ----------
function clearHint() { hintCar = -1; hintDecal.visible = false; }
function bestHint() { const f = J.free(Lg, S).filter(i => cars[i].mode === 'park' && !cars[i].drop); if (!f.length) return -1; const h = J.hint(Lg, S); return f.includes(h) ? h : f[0]; }
function showHint(hand = true) { const i = bestHint(); if (i < 0) return; hintCar = i; hintDecal.visible = true; if (hand) showHand(cars[i]); }
function onHintBtn() { if (state !== 'play') return; Sound.init(); Sound.ui(); showHint(true); }
function showHand(c) { const h = $('hand'); h.hidden = false; h.dataset.car = c.i; posHand(); }
function hideHand() { $('hand').hidden = true; }
function posHand() { const h = $('hand'); if (h.hidden) return; const c = cars[+h.dataset.car]; if (!c || c.mode === 'gone' || c.mode === 'leave') { h.hidden = true; return; } const p = carScreen(c, 0.9); h.style.left = p.x + 'px'; h.style.top = p.y + 'px'; }
// 3-second "how to play": hand on the first free vehicle
function howTo() {
  howToUntil = tNow + 3.2; $('tut').textContent = 'Tap a van to drive it out'; $('tutWrap').hidden = false;
  const go = () => { if (tNow > howToUntil || state !== 'play') return; const i = bestHint(); if (i < 0) { later(0.2, go); return; } hintCar = i; hintDecal.visible = true; showHand(cars[i]); };
  later(0.25, go); later(3.2, endHowTo);
  if (!IS_TOUCH && innerWidth >= 600) { $('keysHint').hidden = false; setTimeout(() => $('keysHint').hidden = true, 6000); }
}
function endHowTo() { if (!howToUntil) return; howToUntil = 0; $('tutWrap').hidden = true; hideHand(); }
function showIntro() {
  const k = lv.intro; if (!k || !INTRO_TXT[k]) return; const [t, s] = INTRO_TXT[k];
  $('introT').textContent = t; $('introS').textContent = s; drawIntroIcon(k);
  setTimeout(() => { if (state === 'play' || state === 'clear') $('intro').classList.add('on'); Sound.pop(); }, 600);
  setTimeout(() => $('intro').classList.remove('on'), 3600);
  setTimeout(() => { for (const c of cars) { const v = c.v; if ((k === 'truck' && v.l === 2) || (k === 'bus' && v.l === 3)) hopCar(c); } }, 900);
}
function drawIntroIcon(k) {
  const cv = $('introIc'), g = cv.getContext('2d'); g.clearRect(0, 0, 92, 92);
  g.fillStyle = '#555e6d'; g.beginPath(); g.roundRect(4, 4, 84, 84, 16); g.fill();
  if (k === 'arrow') { g.fillStyle = '#ffe14a'; g.beginPath(); g.moveTo(46, 14); g.lineTo(74, 44); g.lineTo(56, 44); g.lineTo(56, 78); g.lineTo(36, 78); g.lineTo(36, 44); g.lineTo(18, 44); g.closePath(); g.fill(); }
  else if (k === 'planter') { g.fillStyle = '#b9c3cf'; g.fillRect(16, 52, 60, 22); g.fillStyle = '#fff'; g.fillRect(14, 46, 64, 9); g.fillStyle = '#2f6d48'; g.beginPath(); g.moveTo(46, 12); g.lineTo(64, 46); g.lineTo(28, 46); g.closePath(); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(46, 12); g.lineTo(53, 25); g.lineTo(39, 25); g.closePath(); g.fill(); }
  else { const L0 = k === 'bus' ? 74 : 60; g.fillStyle = Brand.get().primary; g.beginPath(); g.roundRect(46 - 15, 46 - L0 / 2, 30, L0, 7); g.fill(); g.fillStyle = '#26344d'; g.fillRect(35, 46 + L0 / 2 - 16, 22, 9); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(36, 46 - L0 / 2 + 8, 20, 20, 5); g.fill(); }
}

// ---------- HUD ----------
function fmtTime(t) { const s = Math.max(0, Math.ceil(t)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function hud() {
  if (!lv) return;
  $('lotT').textContent = `LOT ${lotNo + 1}`;
  $('lotSub').textContent = `${lv.name} · ${S.left} to go`;
  $('timeN').textContent = fmtTime(timeLeft);
}
function updateTimer(dt) {
  if (state !== 'play' && state !== 'clear') return;
  timeLeft -= dt;
  const s = Math.ceil(timeLeft);
  $('timeN').textContent = fmtTime(timeLeft);
  $('timerBox').classList.toggle('urgent', timeLeft <= 10 && timeLeft > 0);
  if (timeLeft <= 10 && s !== lastTick && s > 0) { lastTick = s; Sound.tick(s <= 3); }
  if (timeLeft > 10) lastTick = 99;
  if (timeLeft <= 0) endRound();
  // idle helper: glow a free vehicle after a while without a delivery
  if (state === 'play' && !idleHinted && !howToUntil && tNow - lastMoveT > 6) { idleHinted = true; showHint(false); $('hintBtn').classList.add('glow'); setTimeout(() => $('hintBtn').classList.remove('glow'), 2500); }
}

// ---------- round flow ----------
let roundId = 0;
function endRound() {
  if (state === 'over') return;
  state = 'over'; timeLeft = 0; $('timeN').textContent = '0:00'; $('timerBox').classList.remove('urgent');
  endHowTo(); hideHand(); clearHint(); selDecal.visible = false; $('intro').classList.remove('on');
  const prev = store.get('best', 0), isBest = score > prev; if (isBest) store.set('best', score);
  const games = store.get('rounds', 0) + 1; store.set('rounds', games);
  Sound.timeUp(); banner("TIME'S UP!", 1300, `${fmt(score)} points`);
  emit(0, 1, 0, 50, SNOWP, { spread: Math.max(RG.hx, RG.hz) * 1.4, up: 6, upR: 4, g: 6, life: 1.6, size: 0.3, jit: RG.hx });
  const my = ++roundId;
  const extra = `<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">` +
    `<span style="background:rgba(0,0,0,.06);border-radius:10px;padding:5px 10px"><b style="font-size:18px">${delivered}</b> deliver${delivered === 1 ? 'y' : 'ies'}</span>` +
    `<span style="background:rgba(0,0,0,.06);border-radius:10px;padding:5px 10px"><b style="font-size:18px">${lotsCleared}</b> lot${lotsCleared === 1 ? '' : 's'} cleared</span></div>` +
    (isBest ? `<b style="color:var(--hp-p)">New personal best!</b>` : `Your best: <b>${fmt(Math.max(prev, score))}</b>`);
  setTimeout(() => {
    if (my !== roundId) return;
    $('banner').classList.remove('on'); bannerUntil = 0;
    Brand.endScreen({ score: fmt(score), extraHtml: extra }).then(() => { if (my === roundId) newRound(); });
  }, 1000);
}
function newRound() {
  score = shownScore = 0; delivered = 0; lotsCleared = 0; timeLeft = ROUND_SECS; lastTick = 99; $('scoreN').textContent = '0';
  for (const k of ['ring', 'ave', 'transit']) { for (const it of traffic[k]) POOLS[it.type].remove(it); traffic[k].length = 0; }
  Sound.init(); Sound.start();
  startLevel(0); state = 'play'; howTo();
}
window.__endRound = () => { if (state === 'ready') dismissSplash(); endRound(); };
Object.defineProperty(window, '__game', { get: () => ({ state, score, delivered, lotsCleared, lot: lotNo + 1, level: LVI, timeLeft: +timeLeft.toFixed(2), left: S && S.left, free: S ? J.free(Lg, S) : [], cars: cars.map(c => ({ i: c.i, kind: ['mini', 'van', 'lorry', 'sleigh'][c.kind], m: c.mode, s: carScreen(c, 0.6) })) }) });
window.__tap = i => tapCar(i);

// ---------- brand ----------
function applyBrand(b) {
  Brand.css();
  $('badgeName').textContent = b.name; $('spName').textContent = b.name;
  $('badgeLogo').src = b.logo; $('spLogo').src = b.logo; $('badgeLogo').alt = $('spLogo').alt = b.name + ' logo';
  document.querySelector('meta[name=theme-color]').content = b.primary;
  boardFrameMat.color.set(b.primary);
  Brand.logoImage().then(img => { logoImg = img; drawBrandCanvases(); fitBoardLogo(); }).catch(() => { logoImg = null; drawBrandCanvases(); });
  drawBrandCanvases();
  for (const c of cars) { c.col = vehColor(c); c.body.material = paint(c.col); }
  recolorTraffic();
}

// ---------- splash ----------
let splashT = 0;
function showSplash() { $('splash').hidden = false; splashT = setTimeout(dismissSplash, 2500); }
function dismissSplash() {
  if (state !== 'ready') return; clearTimeout(splashT);
  const sp = $('splash'); sp.classList.add('out'); setTimeout(() => sp.hidden = true, 650);
  $('hud').hidden = false; $('bottom').hidden = false; state = 'play'; lastMoveT = tNow; howTo();
}
$('splash').addEventListener('pointerdown', e => { e.preventDefault(); Sound.init(); Sound.start(); dismissSplash(); });

// ================= Input =================
const ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.6), _hit = new THREE.Vector3();
function pickCar(cx, cy) {
  _ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(_ndc, camera);
  if (!ray.ray.intersectPlane(_plane, _hit)) return -1;
  let best = -1, bd = 1e9;
  for (const c of cars) {
    if (c.mode !== 'park') continue; const v = c.v;
    const fx = J.DX[v.d], fz = J.DZ[v.d], dx = _hit.x - c.rest.x, dz = _hit.z - c.rest.z;
    const along = Math.abs(dx * fx + dz * fz), across = Math.abs(dx * -fz + dz * fx);
    const ea = Math.max(0, along - v.l * C / 2 + 0.15), ec = Math.max(0, across - 0.8);
    const d = Math.hypot(ea, ec); if (d < bd) { bd = d; best = c.i; }
  }
  return bd < (IS_TOUCH ? 0.9 : 0.5) ? best : -1;
}
canvas.addEventListener('pointerdown', e => {
  Sound.init(); if (state === 'ready') { dismissSplash(); return; } if (state !== 'play') return;
  const i = pickCar(e.clientX, e.clientY); if (i >= 0) { selCar = -1; selDecal.visible = false; tapCar(i); }
});
function moveSel(dx, dy) {
  const live = cars.filter(c => c.mode === 'park'); if (!live.length) return;
  if (selCar < 0 || !cars[selCar] || cars[selCar].mode !== 'park') { let bd = 1e9; for (const c of live) { const p = carScreen(c, 0.5), d = Math.hypot(p.x - innerWidth / 2, p.y - innerHeight / 2); if (d < bd) { bd = d; selCar = c.i; } } }
  else {
    const a = carScreen(cars[selCar], 0.5); let best = -1, bs = 1e9;
    for (const c of live) { if (c.i === selCar) continue; const b = carScreen(c, 0.5), vx = b.x - a.x, vy = b.y - a.y, along = vx * dx + vy * dy; if (along <= 4) continue; const across = Math.abs(vx * dy - vy * dx); const sc = along + across * 2.2; if (sc < bs) { bs = sc; best = c.i; } }
    if (best >= 0) selCar = best;
  }
  selDecal.visible = true; Sound.tone(700, 0.04, 'triangle', 0.05);
}
addEventListener('keydown', e => {
  if (document.querySelector('.hp-end')) return; // end card handles its own keys
  Sound.init(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  const c = e.code;
  if (state === 'ready') { Sound.start(); dismissSplash(); return; }
  if (c === 'KeyM') { toggleMute(); return; }
  if (state !== 'play') return;
  if (c === 'ArrowUp' || c === 'KeyW') moveSel(0, -1); else if (c === 'ArrowDown' || c === 'KeyS') moveSel(0, 1);
  else if (c === 'ArrowLeft' || c === 'KeyA') moveSel(-1, 0); else if (c === 'ArrowRight' || c === 'KeyD') moveSel(1, 0);
  else if ((c === 'Space' || c === 'Enter') && selCar >= 0) { const k = selCar; tapCar(k); if (cars[k] && cars[k].mode !== 'park') { selCar = -1; selDecal.visible = false; setTimeout(() => { if (state === 'play') moveSel(0, 0); }, 10); } }
  else if (c === 'Space' || c === 'Enter') moveSel(0, 0);
  else if (c === 'KeyH') onHintBtn();
});
const SPK_ON = '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>', SPK_OFF = '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); $('muteBtn').innerHTML = Sound.muted ? SPK_OFF : SPK_ON; }
$('muteBtn').onclick = toggleMute; $('muteBtn').innerHTML = Sound.muted ? SPK_OFF : SPK_ON;
$('hintBtn').onclick = onHintBtn;
document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.pause(); else Sound.resume(); });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); if (lv) fitCamera(false); else { camera.aspect = w / h; camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);

// ================= Loop =================
let last = 0, twT = 0;
function step(dt) {
  if (hitStop > 0) { hitStop -= dt; dt *= 0.15; }
  if (state !== 'loading' && !document.hidden) {
    tNow += dt; runTimers();
    updateCars(dt); updatePops(); updateTraffic(dt); updateParts(dt); updateSnow(dt); updateTimer(dt);
    twT += dt; if (twT > 0.45) { twT = 0; twinkle(); const bm = board.userData.bulbs; if (bm) bm.forEach((m, k) => m.material.color.set(BULBS[(k + bulbPhase) % BULBS.length])); }
  }
  return dt;
}
function render(dt) {
  updateCamera(dt);
  for (const c of cars) if (c.roof) c.roof.rotation.y = cam.yaw - c.g.rotation.y;
  if (hintCar >= 0 && cars[hintCar]) { const c = cars[hintCar]; if (c.mode === 'gone' || c.mode === 'leave') clearHint(); else { hintDecal.position.set(c.g.position.x, 0.05, c.g.position.z); hintDecal.rotation.y = c.g.rotation.y; const p = 1 + Math.sin(tNow * 8) * 0.08; hintDecal.scale.set(2.6 * p, 1, (c.v.l * C + 0.8) * p); } }
  if (selDecal.visible && selCar >= 0 && cars[selCar]) { const c = cars[selCar]; selDecal.position.set(c.g.position.x, 0.04, c.g.position.z); selDecal.rotation.y = c.g.rotation.y; selDecal.scale.set(2.4, 1, c.v.l * C + 0.6); }
  posHand(); updateUI();
  renderer.render(scene, camera);
}
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  const d2 = step(dt); render(d2);
  requestAnimationFrame(frame);
}

// ================= Boot =================
resize();
Brand.onChange(applyBrand);
state = 'ready';
startLevel(0);
showSplash();
$('loading').hidden = true;
requestAnimationFrame(frame);
</script>
