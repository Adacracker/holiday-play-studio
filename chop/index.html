  $('hintTxt').hidden = false; $('hintTxt').classList.remove('out'); $('hand').classList.remove('out'); $('keys').classList.remove('out');
  $('hand').hidden = !TOUCHY; $('keys').hidden = TOUCHY;
}
function hideHint(now) {
  if (!hint.on && !now) return; hint.on = false;
  for (const id of ['hintTxt', 'hand', 'keys']) { $(id).classList.add('out'); if (now) $(id).hidden = true; }
  if (!now) setTimeout(() => { if (!hint.on) for (const id of ['hintTxt', 'hand', 'keys']) $(id).hidden = true; }, 380);
}
const KEYMAP = { ArrowUp: 'KeyW', ArrowLeft: 'KeyA', ArrowDown: 'KeyS', ArrowRight: 'KeyD' };
function hintFrame(dt) {
  if (!hint.on) return; hint.t -= dt; if (hint.t <= 0) { hideHint(); return; }
  const gp = goalPoint() || (P.aim >= 0 ? [T.x[P.aim], T.z[P.aim]] : [P.x + 4, P.z]);
  if (TOUCHY) {
    v3.set(gp[0], 1.6, gp[1]).project(camera); const gx = (v3.x + 1) / 2 * innerWidth, gy = (1 - v3.y) / 2 * innerHeight;
    v4.set(P.x, 1, P.z).project(camera); const px = (v4.x + 1) / 2 * innerWidth, py = (1 - v4.y) / 2 * innerHeight, l = Math.hypot(gx - px, gy - py) || 1;
    const h = $('hand'); h.style.left = clamp(px, 40, innerWidth - 120) + 'px'; h.style.top = clamp(py + 50, 120, innerHeight - 160) + 'px';
    h.style.setProperty('--dx', ((gx - px) / l * 90).toFixed(0) + 'px'); h.style.setProperty('--dy', ((gy - py) / l * 90).toFixed(0) + 'px');
  } else {
    const dx = gp[0] - P.x, dz = gp[1] - P.z, want = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'KeyD' : 'KeyA') : (dz > 0 ? 'KeyS' : 'KeyW');

  }
}
try { navigator.keyboard && navigator.keyboard.getLayoutMap && navigator.keyboard.getLayoutMap().then(m => { for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) { const l = m.get(c); if (l) $('k' + c).textContent = l.toUpperCase(); } }).catch(() => {}); } catch {}
function runSplash() {
  const sp = $('splash'); sp.hidden = false;
  setTimeout(showHint, 1700);
  setTimeout(() => sp.classList.add('fade'), 2200);
  setTimeout(() => { sp.hidden = true; startClock(); }, 2950);
}

// ================= Input =================
const MUTE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const MUTE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintMute() { const b = $('muteBtn'); b.innerHTML = Sound.muted ? MUTE_OFF : MUTE_ON; b.style.color = Sound.muted ? '#888' : 'var(--brand-primary)'; }
function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); paintMute(); }
addEventListener('pointerdown', () => Sound.init(), true);
addEventListener('keydown', e => {
  Sound.init(); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyM' && !e.repeat) { toggleMute(); return; }
  if (state === 'play') keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); joy.on = false; showJoy(false); });
function showJoy(on) { $('joyBase').hidden = $('joyKnob').hidden = !on || !TOUCHY; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  joy = { on: true, id: e.pointerId, ox: e.clientX, oy: e.clientY, x: 0, y: 0 }; try { canvas.setPointerCapture(e.pointerId); } catch {}
  const b = $('joyBase').style, k = $('joyKnob').style; b.left = k.left = e.clientX + 'px'; b.top = k.top = e.clientY + 'px'; showJoy(true);
});
canvas.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== joy.id) return; const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, d = Math.hypot(dx, dy), m = 50;
  joy.x = d > 6 ? dx / Math.max(d, m) : 0; joy.y = d > 6 ? dy / Math.max(d, m) : 0;
  const kk = Math.min(d, 50) / (d || 1), k = $('joyKnob').style; k.left = (joy.ox + dx * kk) + 'px'; k.top = (joy.oy + dy * kk) + 'px';
});
const endJoy = e => { if (e.pointerId === joy.id) { joy.on = false; showJoy(false); } };
canvas.addEventListener('pointerup', endJoy); canvas.addEventListener('pointercancel', endJoy);
$('muteBtn').onclick = toggleMute; paintMute();
document.addEventListener('visibilitychange', () => { if (document.hidden) { paused = true; keys.clear(); joy.on = false; showJoy(false); Sound.pause(); } else { paused = false; Sound.resume(); } });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = h > w ? 62 : 50; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let last = 0, hudT = 0;
function step(dt) {
  if (paused) return 0;
  tickClock(dt);
  if (hitStop > 0) { hitStop -= dt; dt *= 0.08; }
  if (state === 'play') update(dt); else { t += dt; updateShakers(dt); updateParts(dt); updateSnow(dt); updateBulbs(dt); updateBursts(dt); updateCargo(dt); }
  return dt;
}
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  const d2 = step(dt); render(d2); hudT -= dt; if (hudT <= 0) { hudT = 0.1; hud(); }
  requestAnimationFrame(frame);
}

// ================= Boot =================
buildLot();
Brand.onChange(applyBrand);
initLogos();
if (document.fonts && document.fonts.load) document.fonts.load('40px KFuture').then(() => { paintSign(BR); paintDeliver(BR); }).catch(() => {});
Promise.race([Promise.all(MODEL_NAMES.map(loadModel)), new Promise(r => setTimeout(r, 10000))]).catch(e => console.warn(e)).then(() => {
  buildForest(); buildDecor(); addLogPile();
  hero.g.rotation.y = P.dir; camera.position.set(P.x, camera.aspect < 1 ? 20.5 : 17, P.z + (camera.aspect < 1 ? 11 : 10));
  state = 'play';
  $('hud').hidden = false; $('timer').hidden = false; $('muteBtn').hidden = false; hud();
  runSplash();
  $('loading').hidden = true;
  requestAnimationFrame(frame);
});

// ================= Test hooks =================
window.__endRound = () => { if (state === 'play') { roundT = 0; timeUp(true); } };
window.__setTime = s => { roundT = s; lastSec = 99; return roundT; };
window.__autoplay = (on = true) => { autoplay = !!on; if (!on) autoMove = null; return autoplay; };
Object.defineProperty(window, '__game', { get: () => ({ state, timeLeft: +roundT.toFixed(1), roundOn, score, chopped, bestChain, delivered, stack: stack.length, P: { x: +P.x.toFixed(1), z: +P.z.toFixed(1) }, gold: gold.i, loose: looseLogs.length, audio: Sound.ctx ? Sound.ctx.state : "none", muted: Sound.muted }) });
