<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A holiday game for you</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='10' width='24' height='18' rx='3' fill='%23b3261e'/%3E%3Crect x='14' y='10' width='4' height='18' fill='%23e8c36a'/%3E%3Crect x='2' y='7' width='28' height='6' rx='2' fill='%23c9372c'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0f2a1f;overflow:hidden}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  iframe{flex:1;width:100%;border:0;display:block;background:#0f2a1f}
  .rib{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;height:30px;
    padding:0 12px calc(env(safe-area-inset-bottom,0px));background:#0b1f17;border-top:1px solid rgba(232,195,106,.25);
    font:600 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.01em}
  .rib a{color:#f6efe2;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rib a b{color:#e8c36a;font-weight:700}
  .rib a:hover{text-decoration:underline}
  .rib a:focus-visible{outline:2px solid #e8c36a;outline-offset:2px;border-radius:4px}
  .msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;
    color:#f6efe2;font:16px/1.5 system-ui,sans-serif}
  .msg a{color:#e8c36a}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="game" title="Holiday game" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="rib"><a href="index.html" target="_top">Holiday Play Studio · <b>Get this game for your business →</b></a></div>
</div>
<div class="msg" id="msg"><p>This link looks incomplete.<br><a href="index.html">See the games →</a></p></div>
<script>
(function () {
  // Link format: play.html#g=<slug>&brand=<base64url JSON>
  var GAMES = ['slice', 'merge', 'sort', 'pop', 'chop', 'jam', 'stack', 'keys'];
  // Short sample links: play.html#s=<secret gist id>/<file> -> JSON {g, brand} fetched from the gist
  function load() {
    var h = location.hash.replace(/^#/, '');
    var s = /(?:^|&)s=([0-9a-f]{20,40})\/([A-Za-z0-9_.-]+)/.exec(h);
    if (s) {
      fetch('https://gist.githubusercontent.com/Adacracker/' + s[1] + '/raw/' + s[2])
        .then(function (r) { return r.json(); })
        .then(function (j) { location.replace('#g=' + j.g + '&brand=' + j.brand); })
        .catch(function () { document.getElementById('msg').style.display = 'flex'; });
      return;
    }
    var g = (/(?:^|&)g=([a-z0-9-]+)/.exec(h) || [])[1];
    var brand = (/(?:^|&)brand=([A-Za-z0-9_-]+)/.exec(h) || [])[1];
    var frame = document.getElementById('game');
    if (!g || GAMES.indexOf(g) < 0) { document.getElementById('msg').style.display = 'flex'; frame.style.visibility = 'hidden'; return; }
    var src = '../' + g + '/index.html' + (brand ? '#brand=' + brand : '');
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    try {
      var b = JSON.parse(decodeURIComponent(escape(atob(brand.replace(/-/g, '+').replace(/_/g, '/')))));
      if (b && b.name) document.title = 'A holiday game from ' + b.name;
    } catch (e) {}
    setTimeout(function () { try { frame.focus(); } catch (e) {} }, 300);
  }
  window.addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>
